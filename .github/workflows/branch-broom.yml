# branch-broom: one line of history. Fold or delete agent branches (rules in
# scripts/consolidate-branches.sh, policy in the README). Never on a schedule: it runs on
# "Run workflow" in the Actions tab, or when a commit changes .github/broom.run (the way an
# agent session presses the button, since agent tokens cannot dispatch workflows). It
# applies only when that file's first line is "apply"; otherwise it prints the plan.
name: branch-broom
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply (merge docs-only branches, delete merged/closed ones). Off = dry-run."
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [".github/broom.run"]
permissions:
  contents: write
  pull-requests: read
concurrency: branch-broom
jobs:
  broom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate branches
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY_INPUT: ${{ inputs.apply }}
        run: |
          apply=no
          [ "$APPLY_INPUT" = "true" ] && apply=yes
          [ "${{ github.event_name }}" = "push" ] && [ "$(head -n1 .github/broom.run 2>/dev/null)" = "apply" ] && apply=yes
          if [ "$apply" = "yes" ]; then scripts/consolidate-branches.sh --apply; else scripts/consolidate-branches.sh; fi
